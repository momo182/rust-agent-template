[project]
name = "rust-agent-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "momo ezhikoff", email = "ezhikoff.net@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ub-mode-crapper>=0.1.0.post1",
    "ub-mode-dryer>=0.1.0.post1",
    "ub-mode-mutator>=0.1.0.post1",
]

[project.scripts]
rust-agent-template = "rust_agent_template:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
